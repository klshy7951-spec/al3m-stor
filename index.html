<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>AL3M STOR — شحن ألعاب</title>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0c;--bar:#000;--surface:#17171a;--line:#2b2b31;--ink:#f4f4f5;--muted:#a3a3ad;
  --red:#e10d2b;--red-d:#8f0618;--gold:#ffc24a;--wa:#25d366;--ok:#4fd8a0;
  color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',Tahoma,sans-serif;line-height:1.6;font-size:16px}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{background:var(--bar);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:.5px;direction:ltr}
.brand svg{width:34px;height:34px}
.chat{color:var(--ink);text-decoration:none;font-weight:700;font-size:15px;border:1px solid var(--line);border-radius:99px;padding:5px 14px;background:var(--surface)}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 100px}
.banner{border-radius:18px;padding:22px 20px;background:radial-gradient(circle at 15% 30%,#ff3b53 0,transparent 45%),linear-gradient(135deg,var(--red) 0,var(--red-d) 60%,#2a0208 100%);display:flex;align-items:center;justify-content:space-between;gap:12px;overflow:hidden}
.banner h2{font-family:'Lalezar',Tahoma,sans-serif;font-weight:400;font-size:30px;line-height:1.2;margin:0 0 4px}
.banner p{margin:0;opacity:.9;font-size:15px}
.banner svg{width:88px;height:88px;flex:none;filter:drop-shadow(0 6px 14px #0008)}
.notice{margin:14px 0;background:var(--surface);border-radius:10px;padding:10px 14px;color:var(--muted);font-weight:500;font-size:15px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:99px;padding:4px 18px;margin-bottom:20px}
.search input{flex:1;background:none;border:0;color:var(--ink);font:500 17px 'Tajawal',sans-serif;padding:12px 0;min-width:0}
.search input:focus{outline:none}
.search:focus-within{outline:3px solid var(--gold)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.card{background:none;border:0;padding:0;color:var(--ink);font-family:inherit;cursor:pointer;text-align:center}
.art{aspect-ratio:1;border-radius:14px;position:relative;overflow:hidden;display:grid;place-items:center;font-size:0;background:radial-gradient(circle at 70% 20%,#ff4d63 0,transparent 40%),linear-gradient(160deg,var(--red) 0,#5b0310 70%,#000 100%)}
.art span{display:block;width:100%;height:100%}.art img{width:100%;height:100%;object-fit:cover;display:block}.art i{display:none}.art i.x{position:absolute;inset-inline:0;bottom:12%;background:var(--red);font:800 15px 'Tajawal',sans-serif;font-style:normal;letter-spacing:.5px;padding:3px 0;direction:ltr}
.card b{display:block;margin-top:8px;font-size:17px}
.card:hover .art{filter:brightness(1.12)}
.empty{color:var(--muted);text-align:center;padding:20px}
.back{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:6px 16px;font:700 15px 'Tajawal',sans-serif;cursor:pointer}
.gtitle{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.gtitle h2{font-family:'Lalezar',Tahoma,sans-serif;font-weight:400;font-size:28px;margin:0}
h3{font-family:'Lalezar',Tahoma,sans-serif;font-weight:400;font-size:21px;margin:26px 0 10px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tab{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:7px 16px;font:700 15px 'Tajawal',sans-serif;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--red);border-color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}
.item{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;color:var(--ink);font-family:inherit}
.item:hover{border-color:var(--red)}
.item[aria-pressed="true"]{border-color:var(--red);background:#2a0a10}
.item b{display:block;font-size:18px}
.item span{display:block;color:var(--gold);font-weight:700}
form{background:var(--surface);border-radius:16px;padding:18px;display:grid;gap:16px}
label,.lbl{font-weight:700;display:block;margin-bottom:6px}
input[type=text]{width:100%;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:12px 14px;font:500 16px 'Tajawal',sans-serif}
input[type=text]:focus{border-color:var(--red)}
.pays{display:flex;flex-wrap:wrap;gap:8px}
.pays label{margin:0;font-weight:500}
.pays input{position:absolute;opacity:0;pointer-events:none}
.pays span{display:block;border:2px solid var(--line);border-radius:12px;padding:8px 16px;cursor:pointer;background:var(--bg)}
.pays input:checked+span{border-color:var(--red);background:#2a0a10;font-weight:700}
.pays input:focus-visible+span{outline:3px solid var(--gold);outline-offset:2px}
.sum{border-top:2px dashed var(--line);padding-top:12px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.sum div{color:var(--muted)}
.sum strong{color:var(--gold);font-size:24px;white-space:nowrap}
.err{color:#ff6b86;font-weight:700;min-height:22px;margin:0}
.wa{display:flex;justify-content:center;align-items:center;gap:10px;background:var(--wa);color:#04210f;border-radius:14px;padding:14px;font:800 18px 'Tajawal',sans-serif;text-decoration:none}
.wa.off{opacity:.4;cursor:not-allowed}
.note{color:var(--muted);font-size:14px;margin:0;text-align:center}
.fab{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--wa);display:grid;place-items:center;box-shadow:0 6px 18px #0009;z-index:6}
.fab svg{width:28px;height:28px}
@media (max-width:420px){.banner svg{width:64px;height:64px}.banner h2{font-size:25px}}
</style>
</head>

var g = 0, c = 0, pick = null, pay = null;
var $ = function(id){return document.getElementById(id)};
function money(n){return n.toLocaleString('en-US')+" "+CUR}
function clean(s){
  return String(s).replace(/\ud83d\udc8e/g, "جوهرة").replace(/[\u{1F000}-\u{1FFFF}\u2600-\u27BF\uFE0F]/gu, "").replace(/\s+/g, " ").trim();
}
function btn(cls, text, pressed, fn){
  var b = document.createElement('button');
  b.type = "button"; b.className = cls; b.textContent = text;
  if (pressed !== null) b.setAttribute('aria-pressed', pressed);
  b.onclick = fn; return b;
}

// ---- الرئيسية ----
function drawCards(filter){
  var box = $('cards'), n = 0; box.innerHTML = "";
  GAMES.forEach(function(G,i){
    var hay = (G.name+" "+G.en).toLowerCase();
    if (filter && hay.indexOf(filter) < 0) return;
    n++;
    var b = btn('card', "", null, function(){ openGame(i) });
    b.innerHTML = '<div class="art"><span aria-hidden="true">'+G.em+'</span><i>'+G.en+'</i></div><b>'+G.name+'</b>';
    box.appendChild(b);
  });
  $('none').hidden = n > 0;
}
$('q').addEventListener('input', function(){ drawCards(this.value.trim().toLowerCase()) });

function openGame(i){
  if (pick && pick.g !== i) pick = null;
  g = i; c = 0;
  $('home').hidden = true; $('game').hidden = false;
  $('gname').textContent = GAMES[i].name;
  draw(); sum(); ready(); window.scrollTo(0,0);
}
$('back').onclick = function(){ $('game').hidden = true; $('home').hidden = false; window.scrollTo(0,0) };

// ---- صفحة اللعبة ----
function draw(){
  var G = GAMES[g], C = G.cats[c];
  $('cats').innerHTML = ""; $('items').innerHTML = "";
  if (G.cats.length > 1) G.cats.forEach(function(x,i){ $('cats').appendChild(btn('tab', x.name, i===c, function(){c=i;draw()})) });
  C.items.forEach(function(it){
    var on = pick && pick.g===g && pick.c===c && pick.n===it[0];
    var b = btn('item', "", on, function(){ pick = {g:g,c:c,n:it[0],p:it[1]}; draw(); sum(); ready(); });
    b.innerHTML = "<b>"+it[0]+"</b><span>"+money(it[1])+"</span>";
    $('items').appendChild(b);
  });
}
function sum(){
  if (!pick) { $('chosen').textContent = "لم تختر باقة بعد"; $('total').textContent = "—"; return; }
  $('chosen').textContent = GAMES[pick.g].name+" — "+pick.n;
  $('total').textContent = money(pick.p);
}
PAYMENTS.forEach(function(p){
  var l = document.createElement('label');
  l.innerHTML = '<input type="radio" name="pay" value="'+p+'"><span>'+p+'</span>';
  l.firstChild.onchange = function(){ pay = p; ready(); };
  $('pays').appendChild(l);
});

function waLink(){
  var G = GAMES[pick.g], C = G.cats[pick.c];
  var t = "طلب جديد - AL3M STOR\n"
        + "اللعبة: " + clean(G.name) + "\n"
        + "القسم: " + clean(C.name) + "\n"
        + "الباقة: " + clean(pick.n) + "\n"
        + "السعر: " + money(pick.p) + "\n"
        + "طريقة الدفع: " + clean(pay) + "\n"
        + "الاسم: " + $('name').value.trim();
  return "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(t);
}
function ready(){
  var ok = !!(pick && pay && $('name').value.trim());
  $('wa').classList.toggle('off', !ok);
  $('wa').setAttribute('aria-disabled', !ok);
  if (ok) { $('err').textContent = ""; $('wa').href = waLink(); } else { $('wa').href = "#"; }
  return ok;
}
$('name').addEventListener('input', ready);
$('wa').addEventListener('click', function(e){
  if (!ready()) {
    e.preventDefault();
    var m = [];
    if (!pick) m.push("الباقة");
    if (!pay) m.push("طريقة الدفع");
    if (!$('name').value.trim()) m.push("الاسم");
    $('err').textContent = "أكمل أولًا: " + m.join("، ");
    return;
  }
  this.href = waLink();
});
$('f').addEventListener('submit', function(e){ e.preventDefault(); });

// ---- زر التواصل العام ----
var hello = "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent("مرحبا AL3M STOR");
$('fab').href = hello; $('chatTop').href = hello;

drawCards("");
</script>
